<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Shippori+Mincho+B1:wght@600&display=swap">
  <style>
    body { margin: 0; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    a { color: #E3A93F; text-decoration: none; }
    a:hover { color: #F0C169; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14120E; color: #F4EFE4; display: flex; flex-direction: column; overflow: hidden;">

  <header style="padding: 18px 20px 16px; border-bottom: 1px solid #2B261E; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: .18em; color: #6E6656;">2026.09.12 FRI</span>
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="display: flex; align-items: center; gap: 5px; color: #E3A93F;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.6c0 2.2-2.6 3-2.6 5.6A2.6 2.6 0 008 9.8a2.6 2.6 0 002.6-2.6C10.6 5 8 4 8 1.6z"/><path d="M4.6 8.4A4.6 4.6 0 008 14.4a4.6 4.6 0 003.4-6"/></svg>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700;">12</span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; color: #A89E8B;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M11.4 2.2a5.9 5.9 0 100 11.6 6.4 6.4 0 010-11.6z"/></svg>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700;">1</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border: 1.5px solid #E3A93F; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 7px; letter-spacing: .14em; color: #8A6A28;">LV</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; line-height: 1; color: #E3A93F;">7</span>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
        <div style="width: 100%; height: 5px; background: #2B261E;">
          <div style="width: 78%; height: 5px; background: #E3A93F;"></div>
        </div>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: #6E6656;">1,240 / 1,500 XP</span>
      </div>
    </div>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; min-height: 0;">

    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h1 style="margin: 0; font-family: 'Shippori Mincho B1', serif; font-size: 18px; font-weight: 600; letter-spacing: .03em;">今日のクエスト</h1>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 11px; color: #6E6656;">1 / 3</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">

      <div style="display: flex; align-items: flex-start; gap: 13px; padding: 14px 15px; min-height: 44px; background: #1D1A15; border: 1px solid #332E25; border-left: 3px solid #E3A93F;">
        <div style="width: 26px; height: 26px; border: 1.5px solid #4A4335; border-radius: 50%; flex-shrink: 0; margin-top: 1px;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
          <span style="font-size: 10px; letter-spacing: .06em; color: #A89E8B;">Tasquest を公開する</span>
          <h2 style="margin: 0; font-family: 'Shippori Mincho B1', serif; font-size: 15px; font-weight: 600; line-height: 1.5;">Supabase のテーブル定義を SQL で書き切る</h2>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #E3A93F;">L　+60 XP</span>
        </div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 13px; padding: 14px 15px; min-height: 44px; background: #191713; border: 1px solid #2B261E; border-left: 3px solid #58C79C;">
        <div style="width: 26px; height: 26px; background: #58C79C; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; color: #14120E;">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4.5 10.5l4 4 7.5-8.5"/></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
          <span style="font-size: 10px; letter-spacing: .06em; color: #55503F;">英語で技術発表する</span>
          <h2 style="margin: 0; font-family: 'Shippori Mincho B1', serif; font-size: 15px; font-weight: 600; line-height: 1.5; color: #6E6656; text-decoration: line-through; text-decoration-color: #453F32;">発表原稿の導入 30 秒を音読して録音する</h2>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #58C79C;">S　+10 XP</span>
        </div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 13px; padding: 14px 15px; min-height: 44px; background: #1D1A15; border: 1px solid #332E25; border-left: 3px solid #7BA8E0;">
        <div style="width: 26px; height: 26px; border: 1.5px solid #4A4335; border-radius: 50%; flex-shrink: 0; margin-top: 1px;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
          <span style="font-size: 10px; letter-spacing: .06em; color: #A89E8B;">週 3 回走る</span>
          <h2 style="margin: 0; font-family: 'Shippori Mincho B1', serif; font-size: 15px; font-weight: 600; line-height: 1.5;">5km を 30 分以内で走る</h2>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #E3A93F;">M　+25 XP</span>
        </div>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 2px; flex-grow: 1; min-height: 0;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #A89E8B;">今日のメモ</span>
      <div style="flex-grow: 1; min-height: 64px; padding: 14px 15px; background: #1A1712; border: 1px solid #332E25;">
        <p style="margin: 0; font-size: 13px; color: #55503F; line-height: 1.8;">できたこと、詰まったこと、やらなかった理由</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #1D1A15; border: 1px solid #332E25;">
      <span style="font-size: 12px; color: #A89E8B;">保存すると</span>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #E3A93F;">+10</span>
        <span style="font-size: 11px; color: #6E6656;">XP　·　連続 13 日目</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; height: 52px; background: #E3A93F; color: #14120E; font-size: 15px; font-weight: 700; letter-spacing: .06em;">記録する</div>

  </div>

  <nav style="display: flex; border-top: 1px solid #2B261E; background: #100E0A;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 0 16px; color: #E3A93F;">
      <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="2.6"/></svg>
      <span style="font-size: 10px;">今日</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 0 16px; color: #6E6656;">
      <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3v14"/><path d="M5 4.2h9l-2 3 2 3H5"/></svg>
      <span style="font-size: 10px;">目標</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 0 16px; color: #6E6656;">
      <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 15.5l1-4 8-8 3 3-8 8z"/><path d="M12 5.5l3 3"/></svg>
      <span style="font-size: 10px;">記録</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 0 16px; color: #6E6656; position: relative;">
      <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M12.8 7.2l-1.7 3.9-3.9 1.7 1.7-3.9z"/></svg>
      <span style="font-size: 10px;">振返</span>
      <span style="position: absolute; top: 9px; right: 26px; width: 6px; height: 6px; background: #D9705C; border-radius: 50%;"></span>
    </div>
  </nav>

</div>
</x-dc>
</body>
</html>
